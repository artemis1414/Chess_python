[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-game"
version = "0.1.0"
description = "Шахматная игра на Python с использованием pygame"
authors = [
    { name = "Artem Dobikov", email = "soadob14@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pygame==2.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/artemis1414/Chess_python"
Repository = "https://github.com/artemis1414/Chess_python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"chess_game" = "src/chess_game"